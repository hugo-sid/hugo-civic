# Theme-level configuration and default params.
#
# NOTE: this file deliberately declares NO [[module.mounts]]. Declaring even one
# mount replaces ALL of Hugo's default mounts (assets, layouts, static, i18n,
# data, archetypes) — a silent failure that produces zero pages with only a
# "found no layout file" warning. See DESIGN.md §3.2.
#
# Sass and JS both resolve @uswds/uswds from the SITE's node_modules without any
# mount. Only font/icon copying needs one, and that mount belongs in the site's
# own config (see exampleSite/hugo.toml).

[module]
  [module.hugoVersion]
    extended = true
    min = "0.146.0"

[params.uswds]
  # Path to the USWDS Sass packages, relative to the SITE root.
  # Must be a real on-disk path — Hugo's virtual filesystem is not consulted
  # for Sass load paths (DESIGN.md §3.1).
  packagesPath = "node_modules/@uswds/uswds/packages"

  # Where mounted USWDS dist assets appear inside assets/.
  distPath = "uswds-dist"

  # Which component set to compile: minimal | standard | full | custom.
  # "custom" compiles assets/uswds/_manifest.scss, which the site supplies.
  preset = "standard"

  # Published asset locations. These feed $theme-image-path / $theme-font-path.
  imagePath = "/img/uswds"
  fontPath = "/fonts"

  # Icon delivery: "inline" embeds individual SVGs (best for a few icons per
  # page), "sprite" publishes the 71 KB sprite and references it via <use>.
  iconMode = "inline"


[params.uswds.theme]
  # Curated USWDS settings exposed to hugo.toml. Everything here is passed into
  # Sass via the hugo:vars module, so retheming needs no SCSS edits.
  colorPrimaryFamily = "blue"
  colorSecondaryFamily = "red"
  colorAccentWarmFamily = "orange"
  colorAccentCoolFamily = "cyan"

  colorPrimary = "blue-60v"
  colorPrimaryDark = "blue-warm-70v"
  colorPrimaryDarker = "blue-warm-80v"
  colorPrimaryLight = "blue-30"
  colorPrimaryLighter = "blue-5"
  colorPrimaryVivid = "blue-warm-60v"

  colorSecondary = "red-50"
  colorBase = "gray-cool-60"
  colorBaseDark = "gray-cool-70"

  fontTypeSans = "public-sans"
  fontTypeSerif = "merriweather"
  fontTypeMono = "roboto-mono"

  fontRoleHeading = "sans"
  fontRoleBody = "sans"
  fontRoleUi = "sans"
  fontRoleCode = "mono"
  fontRoleAlt = "serif"

  gridContainerMaxWidth = "desktop"
  bannerBackgroundColor = "base-lightest"

[params.uswds.banner]
  enable = true

[params.uswds.identifier]
  enable = true
  domain = "example.gov"
  taxpayerDisclaimer = false
  showUsagov = true
  [params.uswds.identifier.parent]
    name = "Example Parent Agency"
    shortname = "EPA"
    url = "https://example.gov"

[params.uswds.header]
  # "basic" or "extended"
  variant = "basic"
  megamenu = false
  search = true

  # The USWDS language selector in the masthead. It renders only when the site
  # declares more than one [languages] entry, so leaving it on costs a
  # single-language site nothing — set it false only to place the control
  # somewhere else. With exactly two languages it is a button-styled link to the
  # other one; with three or more, a dropdown.
  languageSelector = true

[params.uswds.search]
  # What happens when the masthead form is submitted.
  #
  #   "pagefind"  the theme's own results page, backed by a Pagefind index that
  #               is built AFTER Hugo exits — see DESIGN.md §15. A site that
  #               does not run that step gets a results page which says so,
  #               not a broken one.
  #   "none"      no search box anywhere. The honest setting for a site that
  #               has not wired up an indexer, and better than a form that
  #               posts at a 404.
  #   "external"  keeps the box and posts it at params.uswds.header.searchAction
  #               (Search.gov, a site-scoped web search, anything).
  #
  # params.uswds.header.search is a different question — "is there a box in the
  # masthead" is a layout choice, and an extended header without one is a
  # legitimate arrangement. This key is "what does submitting it do".
  provider = "pagefind"

  # Where the results template lives. The masthead form's action defaults here,
  # so moving the page is one edit rather than two. The page itself is content
  # the SITE supplies (`layout: search` front matter); the theme only ships the
  # template that renders it.
  page = "/search/"

  # Results rendered before the "load more" button appears. Pagefind returns
  # every match at once, so this is a rendering budget, not a query limit.
  resultsPerPage = 10

[params.uswds.footer]
  # "default", "slim", or "big"
  variant = "default"
  returnToTop = true

[params.uswds.article]
  # What appears around a single page's content. All of it is a no-op on a page
  # that has nothing to show — a documentation page with no date, no siblings
  # and no tags renders exactly what it did before these existed.
  #
  # An article ends with ONE onward block, never two: related content when the
  # related index matches, previous/next when it does not. See
  # _partials/article/onward.html for why.
  #
  # The side navigation is not here. It is per-section front matter
  # (`sidenav: false`, usually cascaded from the section's _index.md), because
  # a site normally wants a tree in its documentation and a flat feed in its
  # news.
  date = true       # date/author byline under the title
  prevNext = true   # the fallback onward block, when nothing is related
  related = 3       # related pages to list; 0 makes prev/next the only branch

# NOTE: [related] is deliberately NOT set here, and cannot usefully be.
#
# Hugo ships a built-in default for it (indices: keywords, date; threshold 80;
# includeNewer false), and a theme's config can only ADD to a key the defaults
# already occupy — never override it. Declaring `includeNewer = true` and
# `[[related.indices]] name = "tags"` in this file merges down to the stock
# keywords/date pair with a tags index appended at an unpredictable weight, and
# includeNewer silently stays false. Verified against Hugo 0.164 with
# `hugo config`.
#
# So the block belongs in the SITE's config, where it takes precedence.
# exampleSite/hugo.toml carries the one this theme recommends, and
# _partials/article/onward.html falls back to previous/next links when a site
# has not set it.

# Pagination, applied by list.html and term.html.
#
# Hugo's own default is 10, restated here so that the number a site has to
# change is visible in the theme's config rather than implied by Hugo's.
[pagination]
  pagerSize = 10
