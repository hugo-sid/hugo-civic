baseURL = "https://civic.sid.one/"
title = "Example Agency"
theme = "hugo-civic"

enableRobotsTXT = true

# ---------------------------------------------------------------------------
# Languages
#
# English stays at / and Spanish goes to /es/. Setting
# defaultContentLanguageInSubdir = true would move every English page to /en/ —
# a site-wide redirect event, and the one decision here a site cannot change
# later for free. See the [languages] block below for the rest.
#
# `locale` used to be set at the top of this file; it now lives per language,
# which is the only place it can differ.
# ---------------------------------------------------------------------------
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# ---------------------------------------------------------------------------
# Mounts
#
# IMPORTANT: declaring even one mount replaces ALL of Hugo's defaults, so the
# standard six are re-declared below before the USWDS one is added. Dropping
# them produces a site with zero pages and only a "found no layout file"
# warning — see DESIGN.md §3.2.
#
# Only the dist mount is strictly required: Sass resolves USWDS through
# includePaths and js.Build resolves it through node_modules, neither of which
# needs a mount. This one exists so fonts and icons can be published through
# Hugo's asset pipeline instead of being copied by hand.
# ---------------------------------------------------------------------------
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "node_modules/@uswds/uswds/dist"
    target = "assets/uswds-dist"
  # Devanagari, Oriya, Tamil and Telugu have no glyphs in any USWDS font, so
  # Hindi, Odia, Tamil and Telugu pages each need a font neither this mount nor
  # USWDS provides. The fontsource packages ship each family self-hosted; only
  # their file assets are mounted, not their own (unused) CSS. See
  # uswds/script-font.html and params.uswds.scriptFonts above.
  [[module.mounts]]
    source = "node_modules/@fontsource/noto-sans-devanagari/files"
    target = "assets/fonts-dist/noto-sans-devanagari"
  [[module.mounts]]
    source = "node_modules/@fontsource/noto-sans-oriya/files"
    target = "assets/fonts-dist/noto-sans-oriya"
  [[module.mounts]]
    source = "node_modules/@fontsource/mukta-malar/files"
    target = "assets/fonts-dist/mukta-malar"
  [[module.mounts]]
    source = "node_modules/@fontsource/noto-sans-telugu/files"
    target = "assets/fonts-dist/noto-sans-telugu"

[params]
  description = "An example site built with the USWDS Hugo theme."

[params.uswds]
  preset = "standard"
  iconMode = "inline"

  # The image a page is shared with when its front matter names none. Resolved
  # through the asset pipeline, so this is a path under assets/.
  ogImage = "img/og-default.png"
  ogImageAlt = "Example Agency"

[params.uswds.theme]
  colorPrimary = "blue-60v"
  colorPrimaryDarker = "blue-warm-80v"

  # USWDS defaults this to `desktop` (1024px), which is too narrow for the docs
  # layout: a side nav and an in-page nav together take ~510px, leaving the
  # prose around 450px — about 50 characters a line. At `desktop-lg` (1200px)
  # the reading column lands near the 68ex measure USWDS caps paragraphs at.
  #
  # It is set globally rather than on the docs template alone so the header,
  # footer and identifier stay aligned with the content below them.
  gridContainerMaxWidth = "desktop-lg"

  # Publish one font family instead of three. USWDS declares @font-face for
  # every configured type whether the site uses it or not, so switching serif
  # and mono off is what actually removes the files.
  fontTypeSerif = false
  fontTypeMono = false
  fontRoleAlt = "sans"

# ---------------------------------------------------------------------------
# Script fonts
#
# Public Sans (and the theme's other USWDS font types) is Latin-only. A
# language whose script it has no glyphs for needs a second, self-hosted
# family — see uswds/script-font.html, which publishes and preloads these on
# any page whose language matches a key here, and does nothing on any page
# that doesn't. `family` is documentation only; the actual @font-face rules
# are hand-written per script in assets/uswds/_custom.scss, scoped to
# :lang(<code>).
#
# Each entry needs its own font package mounted below, under
# assets/fonts-dist/<mount>/ — see [[module.mounts]] above.
# ---------------------------------------------------------------------------
[params.uswds.scriptFonts.hi]
  family = "Noto Sans Devanagari"
  mount = "noto-sans-devanagari"
  subset = "devanagari"
[params.uswds.scriptFonts.or]
  family = "Noto Sans Oriya"
  mount = "noto-sans-oriya"
  subset = "oriya"
[params.uswds.scriptFonts.ta]
  family = "Mukta Malar"
  mount = "mukta-malar"
  subset = "tamil"
[params.uswds.scriptFonts.te]
  family = "Noto Sans Telugu"
  mount = "noto-sans-telugu"
  subset = "telugu"

[params.uswds.header]
  variant = "extended"
  search = true

# Search is a two-part feature and only one part is a template: the index is
# built by Pagefind AFTER Hugo exits, so `hugo` alone never produces one. Both
# `npm run build` and tools/vercel-build.sh run that second step; `npm run dev`
# does not, which is why /search/ in the dev server explains itself instead of
# returning nothing. See DESIGN.md §15.
[params.uswds.search]
  provider = "pagefind"
  page = "/search/"
  resultsPerPage = 10

[params.uswds.footer]
  variant = "default"
  [params.uswds.footer.contact]
    agencyName = "Example Agency"
    heading = "Agency Contact Center"
    phone = "1-800-555-5555"
    email = "info@example.gov"

[params.uswds.identifier]
  domain = "example.gov"
  showUsagov = true
  [params.uswds.identifier.parent]
    name = "Example Parent Agency"
    shortname = "EPA"
    url = "https://example.gov"
  [params.uswds.identifier.links]
    about = "/about/"
    accessibility = "/accessibility/"
    foia = "/foia/"
    no_fear_act = "/no-fear-act/"
    inspector_general = "/inspector-general/"
    performance = "/performance/"
    privacy = "/privacy/"

# Five, rather than Hugo's ten, so that the news section demonstrates the
# pagination component with the eight posts it carries.
[pagination]
  pagerSize = 5

# Related content, read by the theme's article/onward.html partial.
#
# This block has to live in the site config: Hugo's built-in default for
# [related] takes precedence over a theme's, so the theme cannot ship it. Copy
# it into your own site to get tag-driven related content.
#
# includeNewer matters more than it looks. Hugo's default of false considers
# only pages OLDER than the current one, which means the newest post — usually
# the most visited page on a news section — is the single page that can never
# show anything here.
[related]
  threshold = 80
  includeNewer = true
  toLower = false

  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 80
  [[related.indices]]
    name = "keywords"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10

# ---------------------------------------------------------------------------
# Languages and menus
#
# Menus are defined PER LANGUAGE rather than once at the top level. On a
# multilingual site a shared [menus] block is inherited by every language, so
# one shared menu means every Spanish page carries English labels pointing at
# pages that may not exist in Spanish — which is the defect this whole section
# exists to avoid.
#
# The Spanish menu is deliberately SHORTER than the English one. Hugo only
# materialises a section in a language that has content in it, and only `about`
# and `news` carry Spanish pages, so listing "Documentación" would put a link to
# a section with nothing in it in the masthead of every Spanish page. A site
# that would rather show its whole structure in every language wants
# `lang.Merge` instead, which fills the gaps from another language — see
# MULTILINGUAL.md §1.3. That is a content decision, not a config detail.
#
# `pageRef` rather than `url`, so Hugo resolves each language's own permalink
# instead of the theme prefixing a string.
#
# No `identifier` on any entry. Identifiers exist so that ONE shared menu can be
# relabelled from i18n/*.toml, which is the right tool when the languages differ
# only in wording; here they differ in structure, so the names are inline and an
# identifier would be dead config that also makes `hugo --printI18nWarnings`
# report a missing translation for every entry.
# ---------------------------------------------------------------------------
[languages]
  [languages.en]
    label = "English"       # NOT languageName: deprecated in Hugo 0.158+, and
    locale = "en-us"        # NOT languageCode: same. Both WARN, and
    weight = 1              # tools/check-build.sh fails the build on a WARN.
    title = "Example Agency"

    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 10
    [[languages.en.menus.main]]
      name = "Documentation"
      pageRef = "/docs"
      weight = 20
    [[languages.en.menus.main]]
      name = "News"
      pageRef = "/news"
      weight = 30

    [[languages.en.menus.secondary]]
      name = "Contact"
      url = "/contact/"
      weight = 10

    [[languages.en.menus.footer]]
      name = "About"
      pageRef = "/about"
      weight = 10
    [[languages.en.menus.footer]]
      name = "Documentation"
      pageRef = "/docs"
      weight = 20
    [[languages.en.menus.footer]]
      name = "News"
      pageRef = "/news"
      weight = 30
    [[languages.en.menus.footer]]
      name = "Privacy"
      url = "/privacy/"
      weight = 40

  [languages.es]
    label = "Español"
    locale = "es-es"
    weight = 2
    title = "Agencia de Ejemplo"

    [languages.es.params]
      description = "Un sitio de ejemplo construido con el tema USWDS para Hugo."

      # params.uswds.search.page is a STRING, and chrome/search.html resolves the
      # masthead form's action as ($s.page | relLangURL). That is correct only
      # while every language uses the same slug. content/search.es.md carries
      # `slug: "buscar"`, so without this override every Spanish masthead posts
      # to /es/search/ — which does not exist — while the page itself sits at
      # /es/buscar/. Silently, on every Spanish page. Language params deep-merge
      # into the root [params], so this overrides one key and inherits provider
      # and resultsPerPage from above.
      [languages.es.params.uswds.search]
        page = "/buscar/"

    [[languages.es.menus.main]]
      name = "Acerca de"
      pageRef = "/about"
      weight = 10
    [[languages.es.menus.main]]
      name = "Noticias"
      pageRef = "/news"
      weight = 30

    # No secondary menu: English's only entry is /contact/, and there is no
    # contact page in either language. A menu entry is a promise.

    [[languages.es.menus.footer]]
      name = "Acerca de"
      pageRef = "/about"
      weight = 10
    [[languages.es.menus.footer]]
      name = "Noticias"
      pageRef = "/news"
      weight = 30

  [languages.hi]
    label = "हिन्दी"
    locale = "hi-in"
    weight = 3
    title = "उदाहरण एजेंसी"

    [languages.hi.params]
      description = "हुगो के लिए USWDS थीम के साथ बनाई गई एक उदाहरण साइट।"

    # content/search.hi.md keeps the default filename-derived slug ("search"),
    # unlike content/search.es.md's `slug: "buscar"` — so params.uswds.search.page
    # needs no per-language override here. See the note on languages.es above
    # for what happens when a translated page DOES localise its slug.

    # Every section has a Hindi translation, unlike Spanish's deliberately
    # shorter menu (§ above), so this menu carries the full English structure.
    [[languages.hi.menus.main]]
      name = "परिचय"
      pageRef = "/about"
      weight = 10
    [[languages.hi.menus.main]]
      name = "दस्तावेज़ीकरण"
      pageRef = "/docs"
      weight = 20
    [[languages.hi.menus.main]]
      name = "समाचार"
      pageRef = "/news"
      weight = 30

    # No secondary menu: English's only entry is /contact/, and there is no
    # contact page in either language.

    [[languages.hi.menus.footer]]
      name = "परिचय"
      pageRef = "/about"
      weight = 10
    [[languages.hi.menus.footer]]
      name = "दस्तावेज़ीकरण"
      pageRef = "/docs"
      weight = 20
    [[languages.hi.menus.footer]]
      name = "समाचार"
      pageRef = "/news"
      weight = 30

  [languages.or]
    label = "ଓଡ଼ିଆ"
    locale = "or-in"
    weight = 4
    title = "ଉଦାହରଣ ଏଜେନ୍ସି"

    [languages.or.params]
      description = "Hugo ପାଇଁ USWDS ଥିମ ସହିତ ତିଆରି ହୋଇଥିବା ଏକ ଉଦାହରଣ ସାଇଟ ।"

    # content/search.or.md keeps the default filename-derived slug ("search"),
    # same reasoning as languages.hi above — no params.uswds.search.page
    # override needed.

    # Every section has an Odia translation, same as Hindi's full menu.
    [[languages.or.menus.main]]
      name = "ପରିଚୟ"
      pageRef = "/about"
      weight = 10
    [[languages.or.menus.main]]
      name = "ଡକ୍ୟୁମେଣ୍ଟେସନ"
      pageRef = "/docs"
      weight = 20
    [[languages.or.menus.main]]
      name = "ସମ୍ବାଦ"
      pageRef = "/news"
      weight = 30

    # No secondary menu: English's only entry is /contact/, and there is no
    # contact page in any language.

    [[languages.or.menus.footer]]
      name = "ପରିଚୟ"
      pageRef = "/about"
      weight = 10
    [[languages.or.menus.footer]]
      name = "ଡକ୍ୟୁମେଣ୍ଟେସନ"
      pageRef = "/docs"
      weight = 20
    [[languages.or.menus.footer]]
      name = "ସମ୍ବାଦ"
      pageRef = "/news"
      weight = 30

  [languages.ta]
    label = "தமிழ்"
    locale = "ta-in"
    weight = 5
    title = "எடுத்துக்காட்டு நிறுவனம்"

    [languages.ta.params]
      description = "Hugo வுக்கான USWDS தீமைப் பயன்படுத்தி உருவாக்கப்பட்ட ஒரு எடுத்துக்காட்டுத் தளம்."

    # content/search.ta.md keeps the default filename-derived slug ("search"),
    # same reasoning as languages.hi and languages.or above — no
    # params.uswds.search.page override needed.

    # Every section has a Tamil translation, same as Hindi's and Odia's full
    # menus.
    [[languages.ta.menus.main]]
      name = "எங்களைப் பற்றி"
      pageRef = "/about"
      weight = 10
    [[languages.ta.menus.main]]
      name = "ஆவணங்கள்"
      pageRef = "/docs"
      weight = 20
    [[languages.ta.menus.main]]
      name = "செய்திகள்"
      pageRef = "/news"
      weight = 30

    # No secondary menu: English's only entry is /contact/, and there is no
    # contact page in any language.

    [[languages.ta.menus.footer]]
      name = "எங்களைப் பற்றி"
      pageRef = "/about"
      weight = 10
    [[languages.ta.menus.footer]]
      name = "ஆவணங்கள்"
      pageRef = "/docs"
      weight = 20
    [[languages.ta.menus.footer]]
      name = "செய்திகள்"
      pageRef = "/news"
      weight = 30

  [languages.te]
    label = "తెలుగు"
    locale = "te-in"
    weight = 6
    title = "ఉదాహరణ సంస్థ"

    [languages.te.params]
      description = "Hugo కోసం USWDS థీమ్‌తో నిర్మించబడిన ఒక ఉదాహరణ సైట్."

    # content/search.te.md keeps the default filename-derived slug ("search"),
    # same reasoning as languages.hi, languages.or and languages.ta above — no
    # params.uswds.search.page override needed.

    # Every section has a Telugu translation, same as the Hindi, Odia and
    # Tamil full menus.
    [[languages.te.menus.main]]
      name = "మా గురించి"
      pageRef = "/about"
      weight = 10
    [[languages.te.menus.main]]
      name = "డాక్యుమెంటేషన్"
      pageRef = "/docs"
      weight = 20
    [[languages.te.menus.main]]
      name = "వార్తలు"
      pageRef = "/news"
      weight = 30

    # No secondary menu: English's only entry is /contact/, and there is no
    # contact page in any language.

    [[languages.te.menus.footer]]
      name = "మా గురించి"
      pageRef = "/about"
      weight = 10
    [[languages.te.menus.footer]]
      name = "డాక్యుమెంటేషన్"
      pageRef = "/docs"
      weight = 20
    [[languages.te.menus.footer]]
      name = "వార్తలు"
      pageRef = "/news"
      weight = 30

# Keep processed images in Hugo's cacheDir rather than ./resources, so that a CI
# platform which restores cacheDir between builds does not reprocess every image
# from scratch. tools/vercel-build.sh points HUGO_CACHEDIR at .vercel/cache.
[caches.images]
  dir = ':cacheDir/images'

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

  # Chroma defaults to `monokai` — a dark editor theme, which is not what a
  # federal page should drop into the middle of its body copy. `github` is the
  # closest light style to USWDS's own palette. noClasses inlines the colours,
  # so no highlight stylesheet has to be published or budgeted for.
  [markup.highlight]
    noClasses = true
    style = "github"
    tabWidth = 2
