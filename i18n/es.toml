other = "Descripción de la agencia"

# Spanish carries the article inside identifier_content ("Un sitio web oficial
# de"), so there is no separate prefix to render — and this value is a single
# space rather than "" on purpose.
#
# Hugo treats an EMPTY translation as a MISSING one: it logs
# i18n|MISSING_TRANSLATION and falls back to the default language, which put
# English's "An" in front of the Spanish sentence — "An Un sitio web oficial
# de" — in the one region of the page that is federally required. A single
# space is non-empty, so no fallback happens; it sits inside an aria-hidden
# span and collapses to nothing on screen. Do not "tidy" it to "".
[identifier_content_prefix]
other = " "

[identifier_content]
other = "Un sitio web oficial de"

[identifier_taxpayer]
other = "Producido y publicado con dinero de los contribuyentes de impuestos."

