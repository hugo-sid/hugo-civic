# --- Búsqueda -------------------------------------------------------------
#
# `%d` y `%s` se sustituyen en el navegador, no en Hugo: el índice se construye
# después de que Hugo termina, así que ni el número de resultados ni la consulta
# se conocen en el momento de la compilación. Conserve el token y traduzca lo
# demás. Véase i18n/en.toml.

[search_results_count]
one = "%d resultado"
other = "%d resultados"

[search_no_results]
