#
# Unlike i18n/es.toml, USWDS ships no official Hindi translation of the
# federally standardised banner/identifier wording to copy — there is no
# upstream 'hi' branch of _banner.twig or _identifier.twig. Every string here,
# banner and identifier included, was translated for this repository and has
# had no native-speaker review. See HINDI.md.

