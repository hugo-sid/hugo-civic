# --- Search -------------------------------------------------------------
#
# `%d` and `%s` are substituted in the browser, not by Hugo — see
# i18n/en.toml. Keep the token, translate everything around it. Hindi's
# plural rule collapses one/other to the same noun form, same as
# item_count above; only the surrounding sentence differs.

[search_results_count]
one = "%d परिणाम"
other = "%d परिणाम"

[search_no_results]
other = "%s के लिए कोई परिणाम नहीं मिला।"

[search_no_results_hint]
