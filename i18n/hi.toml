# --- Agency identifier ---------------------------------------------------
#
# Translated for this repository; no upstream Hindi source exists to copy.

[identifier_masthead_aria]
other = "एजेंसी पहचानकर्ता"

[identifier_identity_aria]
other = "एजेंसी विवरण"

# Hindi, like Spanish, carries no separate leading article the way English's
# "An" does — "official website of the" needs nothing prepended to read
# naturally. Per identifier.html and the note in i18n/es.toml, an EMPTY
# translation is treated as MISSING and falls back to English, so this is a
# single space rather than "" — non-empty, renders as nothing inside its
# aria-hidden span. Do not "tidy" it to "".
[identifier_content_prefix]
other = " "

[identifier_content]
other = "की एक आधिकारिक वेबसाइट"

