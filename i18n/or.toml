# Odia strings.
#
# Unlike i18n/es.toml, USWDS ships no official Odia translation of the
# federally standardised banner/identifier wording to copy — there is no
# upstream 'or' branch of _banner.twig or _identifier.twig. Every string
# here, banner and identifier included, was translated for this repository
# and has had no native-speaker review.
#
# Weight this review recommendation more heavily than i18n/hi.toml's: Odia is
# a lower-resource language for machine translation than Hindi is, so treat
# this file as a demo fixture, not production-ready copy, until a native
# speaker has checked it. See ODIA.md §5.
#
# TYPOGRAPHY, and it is invisible — read this before editing any string here.
#
# Every danda (।, U+0964) in this file is preceded by a NO-BREAK SPACE
# (U+00A0), never an ordinary space and never nothing at all:
#
#   ...ଅଟେ ।     <- U+00A0 + U+0964
#
# The space is required because Odia's aa-kar matra (ା, U+0B3E) is very
# nearly the danda's twin; set tight against the preceding consonant, a danda
# reads as a matra hanging off that letter rather than as a full stop. The
# space has to be non-breaking because an ordinary one lets the line wrap
# between word and danda, orphaning the danda at the start of the next line.
#
# Your editor renders U+00A0 exactly like a normal space, so retyping a
# sentence silently replaces it and the site still builds. When editing, copy
# an existing pair rather than typing the danda fresh. The same rule applies
# to every exampleSite/content/*.or.md file and to the Odia strings in
# exampleSite/hugo.toml.
#
# tools/check-danda.sh enforces this (npm run check:danda, and part of
# npm run check). It classifies dandas by script, so Hindi's — which are set
# tight by convention — are left alone. See ODIA.md §7.

