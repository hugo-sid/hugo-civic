# Telugu strings.
#
# Like i18n/hi.toml, i18n/or.toml and i18n/ta.toml, and unlike i18n/es.toml,
# USWDS ships no official Telugu translation of the federally standardised
# banner/identifier wording to copy — there is no upstream 'te' branch of
# _banner.twig or _identifier.twig. Every string here, banner and identifier
# included, was translated for this repository and has had no native-speaker
# review. Treat this as a demo fixture until someone who reads Telugu has been
# through it. See TELUGU.md §4.
#
# No danda here, and that is not an omission. Modern Telugu prose ends a
# sentence with a full stop, not U+0964, so tools/check-danda.sh has nothing to
# check in this file and the no-break-space rule that governs every Odia string
# does not apply to any Telugu one. See TELUGU.md §5.
#
# ZWNJ (U+200C) is load-bearing in several strings and is NOT stray whitespace.
# Telugu forms a conjunct across a virama, so "వెబ్" + "సైట్" would render as a
# single ligature without it; "వెబ్‌సైట్", "సైట్‌లో", "కంటెంట్‌కు" and
# "ఇన్‌స్పెక్టర్" each carry one. Deleting them changes the letterforms.
#
# Register: these are set in the ordinary written Telugu a government site
# would publish, not in literary Telugu. Where a technical term has no settled
# Telugu equivalent that a reader would recognise faster than the English
# (JavaScript, FOIA, HTTPS, .gov, USA.gov), the English is kept — translating
# it would make the string harder to act on, not easier.

