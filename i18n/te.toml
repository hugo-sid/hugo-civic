# --- Agency identifier ---------------------------------------------------
#
# WORD ORDER, and Telugu follows i18n/ta.toml here rather than i18n/hi.toml
# and i18n/or.toml.
#
# chrome/identifier.html renders identifier_content and THEN the agency's
# name, because the English sentence runs "An official website of the <a>".
# Telugu, like Tamil, marks that relationship with a postposition AFTER the
# name — the agency has to come first — and no i18n string can reorder a
# template.
#
# i18n/hi.toml and i18n/or.toml answered this by translating the tail of the
# English sentence anyway, which renders the postposition in front of the word
# it governs and is not a sentence in either language. Rather than reproduce
# that in a fourth language, Telugu uses the label form Tamil introduced —
# "అధికారిక వెబ్‌సైట్: <agency>" — which is correct Telugu in the order the
# template actually emits. See TELUGU.md §6 and TAMIL.md §6, which propose
# fixing the partial so all four can use a natural sentence.

[identifier_content_prefix]
other = " "

[identifier_content]
other = "అధికారిక వెబ్‌సైట్:"

[identifier_taxpayer]
other = "పన్ను చెల్లింపుదారుల ఖర్చుతో తయారు చేయబడి ప్రచురించబడింది."

