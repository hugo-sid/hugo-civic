# --- Agency identifier ---------------------------------------------------
#
# WORD ORDER, and it is the one place Tamil cannot follow Hindi and Odia.
#
# chrome/identifier.html renders identifier_content and THEN the agency's
# name, because the English sentence runs "An official website of the <a>".
# Tamil marks that relationship with a postposition AFTER the name — the
# agency has to come first — and no i18n string can reorder a template.
#
# i18n/hi.toml and i18n/or.toml answered this by translating the tail of the
# English sentence anyway ("की एक आधिकारिक वेबसाइट"), which renders as
# "की एक आधिकारिक वेबसाइट Example Parent Agency": the postposition sits in
# front of the word it governs, which is not a sentence in either language.
#
# Rather than reproduce that in a third language, Tamil uses a label form —
# "அதிகாரப்பூர்வ இணையதளம்: <agency>" — which is correct Tamil in the order
# the template actually emits. See TAMIL.md §6, which proposes fixing the
# partial so all three can use a natural sentence.

[identifier_content_prefix]
other = " "

[identifier_content]
other = "அதிகாரப்பூர்வ இணையதளம்:"

[identifier_taxpayer]
other = "வரி செலுத்துவோரின் செலவில் தயாரிக்கப்பட்டு வெளியிடப்பட்டது."

