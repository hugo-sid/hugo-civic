# Tamil strings.
#
# Like i18n/hi.toml and i18n/or.toml, and unlike i18n/es.toml, USWDS ships no
# official Tamil translation of the federally standardised banner/identifier
# wording to copy — there is no upstream 'ta' branch of _banner.twig or
# _identifier.twig. Every string here, banner and identifier included, was
# translated for this repository and has had no native-speaker review. Treat
# this as a demo fixture until someone who reads Tamil has been through it.
# See TAMIL.md §4.
#
# No danda here, and that is not an omission. Tamil does not use U+0964; it
# ends sentences with a full stop, so tools/check-danda.sh has nothing to
# check in this file and the no-break-space rule that governs every Odia
# string does not apply to any Tamil one. See TAMIL.md §5.
#
# Register: these are set in the ordinary written Tamil a government site
# would publish, not in high literary Tamil. Where a technical term has no
# settled Tamil equivalent that a reader would recognise faster than the
# English (JavaScript, FOIA, HTTPS, .gov, USA.gov), the English is kept —
# translating it would make the string harder to act on, not easier.

[skipnav]
other = "முதன்மை உள்ளடக்கத்திற்குச் செல்"

[menu]
